name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prebuilt_tag:
        description: 'Sign an audited installer already uploaded to this draft release. Leave blank to build from source.'
        required: false
        type: string
permissions:
  contents: write
jobs:
  windows:
    if: ${{ inputs.prebuilt_tag == '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run relay:test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          DISCORD_SOCIAL_SDK_URL: ${{ secrets.DISCORD_SOCIAL_SDK_URL }}
        with:
          tagName: v__VERSION__
          releaseName: Moewatch v__VERSION__
          releaseBody: 'Hotfix for v0.1.16: restore native video picture-in-picture, fix volume dragging and player menu focus, simplify player settings, and preserve saved autoplay preferences. Windows x64 installer below. Updates require an explicit install click in Settings.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
  sign-prebuilt:
    if: ${{ inputs.prebuilt_tag != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.prebuilt_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download audited installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.prebuilt_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          gh release download $env:RELEASE_TAG --pattern '*.exe' --dir artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
      - name: Sign and verify updater assets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          RELEASE_TAG: ${{ inputs.prebuilt_tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release version mismatch' }
          $installer = "artifacts/release/Moewatch_${version}_x64-setup.exe"
          npx tauri signer sign --app-version $version $installer
          if ($LASTEXITCODE -ne 0) { throw 'Updater signing failed' }
          node scripts/release-manifest.mjs $env:RELEASE_TAG $installer
          if ($LASTEXITCODE -ne 0) { throw 'Updater signature verification failed' }
      - name: Upload verified updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.prebuilt_tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release upload $env:RELEASE_TAG "artifacts/release/Moewatch_${version}_x64-setup.exe.sig" artifacts/release/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Updater upload failed' }
